global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  # ---------------------------------------------------------
  # Prometheus (auto-monitoramento)
  # ---------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # ---------------------------------------------------------
  # Spring Boot Actuator /metrics
  # ---------------------------------------------------------
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]

  # ---------------------------------------------------------
  # OpenTelemetry Collector (metrics pipeline)
  # ---------------------------------------------------------
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  # ---------------------------------------------------------
  # Loki (métricas internas)
  # ---------------------------------------------------------
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # ---------------------------------------------------------
  # Tempo (métricas internas)
  # ---------------------------------------------------------
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]