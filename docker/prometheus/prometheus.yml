global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  # ---------------------------------------------------------
  # Prometheus (auto-monitoramento)
  # ---------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # ---------------------------------------------------------
  # Security Server (rodando no host - default IDE/Gradle)
  # ---------------------------------------------------------
  - job_name: security-server-host
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9001"]

  # ---------------------------------------------------------
  # Security Server (rodando em container "security-server")
  # ---------------------------------------------------------
  - job_name: security-server-container
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["security-server:9001"]

  # ---------------------------------------------------------
  # OrderQuestionnaire (rodando no host - default IDE/Gradle)
  # ---------------------------------------------------------
  - job_name: orderquestionnaire-host
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9005"]

  # ---------------------------------------------------------
  # OrderQuestionnaire (rodando em container "orderquestionnaire")
  # ---------------------------------------------------------
  - job_name: orderquestionnaire-container
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orderquestionnaire:9005"]

  # ---------------------------------------------------------
  # OpenTelemetry Collector (metrics pipeline)
  # ---------------------------------------------------------
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  # ---------------------------------------------------------
  # Loki (métricas internas)
  # ---------------------------------------------------------
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # ---------------------------------------------------------
  # Tempo (métricas internas)
  # ---------------------------------------------------------
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]