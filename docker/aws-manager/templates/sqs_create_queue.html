<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar fila SQS</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/tailwind.css" rel="stylesheet">

    <script src="/static/theme.js"></script>
    <script src="/static/layout.js"></script>
</head>

<body id="pageBody" class="bg-gray-100 text-gray-900 transition-colors duration-500">

<div id="mainCard" class="max-w-3xl mx-auto mt-10 bg-white shadow-lg rounded-lg p-8 transition-colors duration-500">
    <div class="mb-6">
        <h1 class="text-3xl font-bold">Criar fila SQS</h1>
        <p class="text-sm text-gray-600 mt-2">Use esta tela para criar filas no emulator antes de enviar mensagens.</p>
    </div>

    <form method="POST" action="/sqs/queues/create" class="space-y-6">
        <div>
            <label class="block font-semibold mb-1">Nome da fila</label>
            <input type="text" name="queue_name" class="w-full border rounded p-2 bg-white" placeholder="ex: pedidos-processamento ou pedidos.fifo" required>
        </div>

        <div class="space-y-2">
            <label class="inline-flex items-center gap-2">
                <input type="checkbox" name="is_fifo">
                <span>Fila FIFO</span>
            </label>
            <label class="inline-flex items-center gap-2">
                <input type="checkbox" name="content_based_dedup">
                <span>Content based deduplication (somente FIFO)</span>
            </label>
        </div>

        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
            Criar fila
        </button>
    </form>

    {% if result %}
    <div class="mt-6 p-4 bg-green-100 text-green-800 rounded">
        {{ result }}
    </div>
    {% endif %}
</div>

<script>
    initLayout()
    initTheme()
</script>

</body>
</html>
