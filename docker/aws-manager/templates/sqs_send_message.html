<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Enviar mensagem SQS</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/static/tailwind.css" rel="stylesheet">

    <script src="/static/theme.js"></script>
    <script src="/static/layout.js"></script>
</head>

<body id="pageBody" class="bg-gray-100 text-gray-900 transition-colors duration-500">

<div id="mainCard" class="max-w-3xl mx-auto mt-10 bg-white shadow-lg rounded-lg p-8 transition-colors duration-500">
    <div class="mb-6">
        <h1 class="text-3xl font-bold">Enviar mensagem para fila SQS</h1>
        <p class="text-sm text-gray-600 mt-2">A fila deve existir previamente. Use a tela de criacao caso necessario.</p>
    </div>

    <form method="POST" action="/sqs/messages/send" class="space-y-6">
        <div>
            <label class="block font-semibold mb-1">Nome da fila</label>
            <input type="text" name="queue_name" class="w-full border rounded p-2 bg-white" placeholder="ex: pedidos-processamento" required>
        </div>

        <div>
            <label class="block font-semibold mb-1">Headers (JSON)</label>
            <textarea name="headers" class="w-full border rounded p-2 h-24 bg-white" placeholder='{"x-origem": "dev"}'>{}</textarea>
        </div>

        <div>
            <label class="block font-semibold mb-1">Body da mensagem (JSON)</label>
            <textarea name="body" class="w-full border rounded p-2 h-32 bg-white" placeholder='{"id": 1, "status": "novo"}' required></textarea>
        </div>

        <div>
            <label class="block font-semibold mb-1">Quantidade de mensagens (batch)</label>
            <input type="number" name="batch" min="1" max="10" value="1" class="w-32 border rounded p-2 bg-white">
        </div>

        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">
            Enviar mensagem
        </button>
    </form>

    {% if result %}
    <div class="mt-6 p-4 bg-green-100 text-green-800 rounded">
        {{ result }}
    </div>
    {% endif %}
</div>

<script>
    initLayout()
    initTheme()
</script>

</body>
</html>
