# docker/promtail/config.yml
server:
  http_listen_port: 9080
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            logger: loggerName
            message: formattedMessage
      - labels:
          level:
          logger:
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'app'
      - replacement: container
        target_label: 'mode'

  - job_name: security-server-host-file
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: loggerName
            message: formattedMessage
      - labels:
          level:
          logger:
    static_configs:
      - targets: [localhost]
        labels:
          job: security-server-host-file
          app: security-server
          mode: host
          __path__: /var/log/security-server-host/*.log

  - job_name: orderquestionnaire-host-file
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: loggerName
            message: formattedMessage
      - labels:
          level:
          logger:
    static_configs:
      - targets: [ localhost ]
        labels:
          job: orderquestionnaire-host-file
          app: orderquestionnaire
          mode: host
          __path__: /var/log/orderquestionnaire-host/*.log
