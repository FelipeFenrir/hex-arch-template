# ========== Configura??es Sonar ==========
systemProp.sonar.gradle.skipCompile=true

# ========== Performance e Stability ==========
# Evitar paralelismo ou daemon ativo (Windows ? mais est?vel assim)
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.daemon=false

# ========== Build Cache - Desabilitar para evitar erros de snapshot ==========
# Em Windows com OneDrive, o Build Cache pode causar problemas ao fazer snapshot de arquivos
# Erro t?pico: "Cannot snapshot... not a regular file"
org.gradle.caching=false

# ========== Configuration Cache - Desabilitar para evitar conflitos ==========
# Pode causar erros ao tentar cachear configura??es com arquivos de teste
org.gradle.configuration-cache=false

# ========== JVM Otimizado para Estabilidade ==========
org.gradle.jvmargs=-Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled

# ========== Limpeza Autom?tica de Arquivos Tempor?rios ==========
# Reduz chances de corrup??o de arquivos
org.gradle.workers.max=2

