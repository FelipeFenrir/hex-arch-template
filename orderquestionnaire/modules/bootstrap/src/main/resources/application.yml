# modules/bootstrap/src/main/resources/application.yml
spring:
  application:
    name: orderquestionnaire
  data:
    mongodb:
      uri: ${ORDERQUESTIONNAIRE_MONGODB_URI:mongodb://localhost:27017/orderquestionnaire}
  threads:
    virtual:
      enabled: true

server:
  port: ${ORDERQUESTIONNAIRE_SERVER_PORT:9005}

management:
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    metrics:
      enabled: true
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes: service.name=orderquestionnaire,service.namespace=acme

logging:
  file:
    name: ${ORDERQUESTIONNAIRE_LOG_FILE:build/logs/orderquestionnaire.log}
  level:
    root: INFO
    org.springframework: INFO

acme:
  observability:
    logging:
      enabled: ${ORDERQUESTIONNAIRE_OBS_LOG_ENABLED:true}
      log-arguments: ${ORDERQUESTIONNAIRE_OBS_LOG_ARGUMENTS:true}
      log-result: ${ORDERQUESTIONNAIRE_OBS_LOG_RESULT:true}
      max-payload-length: ${ORDERQUESTIONNAIRE_OBS_MAX_PAYLOAD_LENGTH:4000}

orderquestionnaire:
  adapters:
    in:
      api-rest:
        cors:
          question:
            search:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTION_SEARCH_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
            create:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTION_CREATE_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
            update:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTION_UPDATE_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
            delete-by-id:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTION_DELETE_BY_ID_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
            delete-batch:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTION_DELETE_BATCH_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
            get-by-id:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTION_GET_BY_ID_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
          questionnaire:
            search:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTIONNAIRE_SEARCH_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
            create:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTIONNAIRE_CREATE_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
            update:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTIONNAIRE_UPDATE_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
            delete-by-id:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTIONNAIRE_DELETE_BY_ID_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
            delete-batch:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTIONNAIRE_DELETE_BATCH_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
            get-by-id:
              allowed-origin-pattern: ${ORDERQUESTIONNAIRE_CORS_QUESTIONNAIRE_GET_BY_ID_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
    out:
      channel-distribution:
        provider: ${ORDERQUESTIONNAIRE_CHANNEL_DISTRIBUTION_PROVIDER:MONGO}
        use-app-database: ${ORDERQUESTIONNAIRE_CHANNEL_DISTRIBUTION_USE_APP_DATABASE:true}
        integrations:
          api:
            base-url: ${ORDERQUESTIONNAIRE_CHANNEL_DISTRIBUTION_API_BASE_URL:http://localhost:8082}
            connect-timeout: ${ORDERQUESTIONNAIRE_CHANNEL_DISTRIBUTION_API_CONNECT_TIMEOUT:2s}
            read-timeout: ${ORDERQUESTIONNAIRE_CHANNEL_DISTRIBUTION_API_READ_TIMEOUT:3s}
            authentication: ${ORDERQUESTIONNAIRE_CHANNEL_DISTRIBUTION_API_AUTHENTICATION:false}
      journey-distribution:
        provider: ${ORDERQUESTIONNAIRE_JOURNEY_DISTRIBUTION_PROVIDER:MONGO}
        use-app-database: ${ORDERQUESTIONNAIRE_JOURNEY_DISTRIBUTION_USE_APP_DATABASE:true}
        integrations:
          api:
            base-url: ${ORDERQUESTIONNAIRE_JOURNEY_DISTRIBUTION_API_BASE_URL:http://localhost:8082}
            connect-timeout: ${ORDERQUESTIONNAIRE_JOURNEY_DISTRIBUTION_API_CONNECT_TIMEOUT:2s}
            read-timeout: ${ORDERQUESTIONNAIRE_JOURNEY_DISTRIBUTION_API_READ_TIMEOUT:3s}
            authentication: ${ORDERQUESTIONNAIRE_JOURNEY_DISTRIBUTION_API_AUTHENTICATION:false}

question:
  pipeline:
    createquestion:
      VALIDATE_COMMAND:
        enabled: true
      CHECK_NO_DUPLICATE:
        enabled: true
      BUILD_AUDIT:
        enabled: true
      BUILD_AND_PERSIST_QUESTION:
        enabled: true
    updatequestion:
      VALIDATE_COMMAND:
        enabled: true
      BUILD_AUDIT:
        enabled: true
      FETCH_EXISTING_QUESTION:
        enabled: true
      RESOLVE_TRANSITION:
        enabled: true
      BUILD_UPDATED_QUESTION:
        enabled: true
      PERSIST_UPDATED_QUESTION:
        enabled: true
    deletequestion:
      VALIDATE_QUESTION_ID:
        enabled: true
      FETCH_QUESTION_FOR_DELETE:
        enabled: true
      CHECK_NOT_IN_USE:
        enabled: true
      DELETE_QUESTION:
        enabled: true

questionnaire:
  pipeline:
    createquestionnaire:
      VALIDATE_COMMAND:
        enabled: true
      BUILD_AUDIT:
        enabled: true
      CHECK_CHANNEL_DISTRIBUTION:
        enabled: true
      CHECK_JOURNEY_DISTRIBUTION:
        enabled: true
      CHECK_NO_DUPLICATE:
        enabled: true
      BUILD_AND_PERSIST_QUESTIONNAIRE:
        enabled: true
    updatequestionnaire:
      VALIDATE_COMMAND:
        enabled: true
      BUILD_AUDIT:
        enabled: true
      FETCH_EXISTING_QUESTIONNAIRE:
        enabled: true
      VALIDATE_ACTIVE_UPDATE_RESTRICTIONS:
        enabled: true
      RESOLVE_CONFIGURED_QUESTIONS:
        enabled: true
      APPLY_UPDATE_TRANSITION:
        enabled: true
      PERSIST_UPDATED_QUESTIONNAIRE:
        enabled: true
    deletequestionnaire:
      VALIDATE_DELETE_COMMAND:
        enabled: true
      FETCH_QUESTIONNAIRE_FOR_DELETE:
        enabled: true
      VALIDATE_DELETE_ELIGIBILITY:
        enabled: true
      DELETE_QUESTIONNAIRE:
        enabled: true
    validatequestionnaireanswers:
      VALIDATE_ANSWERS_COMMAND:
        enabled: true
      FETCH_QUESTIONNAIRE_FOR_ANSWER_VALIDATION:
        enabled: true
      VALIDATE_QUESTIONNAIRE_ANSWERS:
        enabled: true
