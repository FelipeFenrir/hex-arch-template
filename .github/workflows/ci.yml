name: Java CI with Gradle

# define global environment variables
env:
  PROJECT_IMAGE_NAME: hex-arch-template

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin' # Boa prática: usar Eclipse Temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3 # Caching automático e eficiente

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
        # O comando 'build' executa compilação, testes unitários e empacotamento

