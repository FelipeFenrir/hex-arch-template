    request:
      url: "{{baseUrl}}/api/v1/questionnaires"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": "",
            "channelDistributionId": "",
            "journeyDistributionId": "",
            "description": "",
            "createdBy": {
              "id": "",
              "referenceCode": "",
              "name": "",
              "email": ""
            }
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
