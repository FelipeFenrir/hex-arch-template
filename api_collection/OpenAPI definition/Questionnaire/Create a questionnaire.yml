          {
            "id": "",
            "channelDistributionId": "",
            "journeyDistributionId": "",
            "description": "",
            "createdBy": {
              "id": "",
              "referenceCode": "",
              "name": "",
              "email": ""
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "data": {
              "id": "",
              "channelDistributionId": "",
              "journeyDistributionId": "",
              "description": "",
              "status": "",
              "configuredQuestions": [
                {
                  "questionId": "",
                  "order": 0,
                  "answerConfiguration": {
                    "type": "",
