info:
  name: Create a questionnaire
  type: http
  seq: 5
  tags:
    - Questionnaire

http:
  method: POST
  url: "{{baseUrl}}/api/v1/questionnaires"
  body:
    type: json
    data: |-
      {
        "id": "",
        "channelDistributionId": "",
        "journeyDistributionId": "",
        "description": "",
        "createdBy": {
          "id": "",
          "referenceCode": "",
          "name": "",
          "email": ""
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
