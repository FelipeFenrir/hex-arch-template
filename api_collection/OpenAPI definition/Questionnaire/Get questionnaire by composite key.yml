info:
  name: Get questionnaire by composite key
  type: http
  seq: 1
  tags:
    - Questionnaire

http:
  method: GET
  url: "{{baseUrl}}/api/v1/questionnaires/:id?channelId=mobile_acmeapp&journeyId=journey_vendaavulsaacme"
  params:
    - name: channelId
      value: mobile_acmeapp
      type: query
    - name: journeyId
      value: journey_vendaavulsaacme
      type: query
    - name: id
      value: questionnaire_checkout
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Questionnaire found
    request:
      url: "{{baseUrl}}/api/v1/questionnaires/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
        - name: channelId
          value: ""
          type: query
        - name: journeyId
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "data": {
              "id": "",
              "channelDistributionId": "",
              "journeyDistributionId": "",
              "description": "",
              "status": "",
              "configuredQuestions": [
                {
                  "questionId": "",
                  "order": 0,
                  "answerConfiguration": {
                    "type": "",
                    "attributes": {}
                  },
                  "rootCondition": {
                    "type": "",
                    "attributes": {},
                    "children": []
                  },
                  "dependsOnQuestionIds": []
                }
              ],
              "createdBy": {
                "id": "",
                "referenceCode": "",
                "name": "",
                "email": ""
              },
              "createdAt": "",
              "updatedBy": {
                "id": "",
                "referenceCode": "",
                "name": "",
                "email": ""
              },
              "updatedAt": ""
            }
          }
  - name: 404 Response
    description: Questionnaire not found
    request:
      url: "{{baseUrl}}/api/v1/questionnaires/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
        - name: channelId
          value: ""
          type: query
        - name: journeyId
          value: ""
