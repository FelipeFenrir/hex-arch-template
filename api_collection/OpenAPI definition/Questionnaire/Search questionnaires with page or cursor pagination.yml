info:
  name: Search questionnaires with page or cursor pagination
  type: http
  seq: 4
  tags:
    - Questionnaire

http:
  method: GET
  url: "{{baseUrl}}/api/v1/questionnaires?size=10&mode=CURSOR"
  params:
    - name: ids
      value: "[]"
      type: query
      disabled: true
    - name: channelIds
      value: "[]"
      type: query
      disabled: true
    - name: journeyIds
      value: "[]"
      type: query
      disabled: true
    - name: descriptionContains
      value: ""
      type: query
      disabled: true
    - name: status
      value: DRAFT
      type: query
      disabled: true
    - name: status
      value: ACTIVE
      type: query
      disabled: true
    - name: status
      value: INACTIVE
      type: query
      disabled: true
    - name: mode
      value: PAGE
      type: query
      disabled: true
    - name: mode
      value: CURSOR
      type: query
      disabled: true
    - name: page
      value: ""
      type: query
      disabled: true
    - name: size
      value: "10"
      type: query
    - name: cursor
      value: ""
      type: query
      disabled: true
    - name: sort
      value: "[]"
      type: query
      disabled: true
    - name: mode
      value: PAGE
      type: query
      description: Pagination mode. Use PAGE or CURSOR. Defaults to PAGE when omitted.
      disabled: true
    - name: mode
      value: CURSOR
      type: query
      description: Pagination mode. Use PAGE or CURSOR. Defaults to PAGE when omitted.
    - name: page
      value: ""
      type: query
      description: Page index (0-based). Use only when mode=PAGE.
      disabled: true
    - name: size
      value: ""
      type: query
      description: Page size for both PAGE and CURSOR modes.
      disabled: true
    - name: cursor
      value: ""
      type: query
      description: Cursor token. Optional for first CURSOR request; required for next pages.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

