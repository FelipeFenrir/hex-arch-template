info:
  name: Delete questionnaires in batch
  type: http
  seq: 6
  tags:
    - Questionnaire

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/questionnaires"
  body:
    type: json
    data: |-
      {
        "items": [
          {
            "id": "",
            "channelId": "",
            "journeyId": ""
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Batch delete processed
    request:
      url: "{{baseUrl}}/api/v1/questionnaires"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": "",
                "channelId": "",
                "journeyId": ""
              }
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "data": {
              "requested": 0,
              "failed": 0,
              "deleted": 0,
              "failures": [
                {
                  "id": "",
                  "channelId": "",
                  "journeyId": "",
                  "code": "",
                  "message": ""
                }
              ]
            }
          }
