info:
  name: Create a question
  type: http
  seq: 5
  tags:
    - Question

http:
  method: POST
  url: "{{baseUrl}}/api/v1/questions"
  body:
    type: json
    data: |-
      {
        "id": "",
        "label": "",
        "salesItemReferenceCode": "",
        "createdBy": {
          "id": "",
          "referenceCode": "",
          "name": "",
          "email": ""
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Question created
    request:
      url: "{{baseUrl}}/api/v1/questions"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": "",
            "label": "",
            "salesItemReferenceCode": "",
            "createdBy": {
              "id": "",
              "referenceCode": "",
              "name": "",
              "email": ""
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "data": {
              "id": "",
              "label": "",
              "status": "",
              "salesItemReferenceCode": "",
              "createdBy": {
                "id": "",
                "referenceCode": "",
                "name": "",
                "email": ""
              },
              "createdAt": ""
            }
          }
  - name: 400 Response
    description: Validation error
    request:
      url: "{{baseUrl}}/api/v1/questions"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": "",
            "label": "",
            "salesItemReferenceCode": "",
            "createdBy": {
              "id": "",
              "referenceCode": "",
              "name": "",
              "email": ""
            }
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Validation error",
            "status": 400,
            "code": "VAL-001",
            "detail": "One or more fields are invalid.",
            "instance": "/api/v1/questions",
            "errors": [
              {
                "field": "label",
                "message": "must not be blank"
              }
            ]
          }
