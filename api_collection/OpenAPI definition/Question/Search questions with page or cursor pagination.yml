info:
  name: Search questions with page or cursor pagination
  type: http
  seq: 4
  tags:
    - Question

http:
  method: GET
  url: "{{baseUrl}}/api/v1/questions?size=10&mode=CURSOR"
  params:
    - name: ids
      value: "[]"
      type: query
      disabled: true
    - name: salesItemReferenceCodes
      value: "[]"
      type: query
      disabled: true
    - name: labelContains
      value: ""
      type: query
      disabled: true
    - name: status
      value: DRAFT
      type: query
      disabled: true
    - name: status
      value: ACTIVE
      type: query
      disabled: true
    - name: status
      value: INACTIVE
      type: query
      disabled: true
    - name: page
      value: ""
      type: query
      disabled: true
    - name: size
      value: "10"
      type: query
    - name: cursor
      value: ""
      type: query
      disabled: true
    - name: sort
      value: "[]"
      type: query
      disabled: true
    - name: mode
      value: CURSOR
      type: query
    - name: mode
      value: PAGE
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

