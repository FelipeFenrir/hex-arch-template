info:
  name: Get question by id
  type: http
  seq: 1
  tags:
    - Question

http:
  method: GET
  url: "{{baseUrl}}/api/v1/questions/:id"
  params:
    - name: id
      value: q_name
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Question found
    request:
      url: "{{baseUrl}}/api/v1/questions/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "data": {
              "id": "",
              "label": "",
              "status": "",
              "salesItemReferenceCode": "",
              "createdBy": {
                "id": "",
                "referenceCode": "",
                "name": "",
                "email": ""
              },
              "createdAt": "",
              "updatedBy": {
                "id": "",
                "referenceCode": "",
                "name": "",
                "email": ""
              },
              "updatedAt": ""
            }
          }
  - name: 404 Response
    description: Question not found
    request:
      url: "{{baseUrl}}/api/v1/questions/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "",
            "title": "",
            "status": 0,
            "detail": "",
            "instance": "",
            "properties": {}
          }
