spring:
  application:
    name: security-server
  data:
    mongodb:
      # Sobrescreva via SECURITY_MONGODB_URI quando precisar.
      uri: ${SECURITY_MONGODB_URI:mongodb://localhost:27017/security}

  thymeleaf:
    enabled: true
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

server:
  # Porta default isolada para evitar colisao com outros apps locais.
  port: ${SECURITY_SERVER_PORT:9001}
  error:
    include-message: always

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: trace
    org.springframework.security.jackson2: INFO
    org.springframework.security.oauth2.server.authorization: TRACE