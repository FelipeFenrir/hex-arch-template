spring:
  application:
    name: security-server
  data:
    mongodb:
      # Sobrescreva via SECURITY_MONGODB_URI quando precisar.
      uri: ${SECURITY_MONGODB_URI:mongodb://localhost:27017/security}
  threads:
    virtual:
      enabled: true

  thymeleaf:
    enabled: true
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

server:
  # Porta default isolada para evitar colisao com outros apps locais.
  port: ${SECURITY_SERVER_PORT:9001}
  error:
    include-message: always

management:
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    metrics:
      enabled: true
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://host.docker.internal:4317}
  resource:
    attributes: service.name=security-server,service.namespace=acme

logging:
  file:
    name: ${SECURITY_SERVER_LOG_FILE:build/logs/security-server.log}
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.security.jackson2: INFO
    org.springframework.security.oauth2.server.authorization: INFO