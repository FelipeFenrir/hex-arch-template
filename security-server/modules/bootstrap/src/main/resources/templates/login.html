<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Login - Auth Server</title>
</head>
<body>
<h2>Login</h2>
<!-- O subdomínio garante que o filtro já sabe o Tenant aqui -->
<div th:if="${param.error}">Usuário ou senha inválidos.</div>
<div th:if="${param.logout}">Você saiu do sistema.</div>

<form th:action="@{/login}" method="post">
    <div>
        <label>Usuário:</label>
        <input type="text" name="username" required autofocus/>
    </div>
    <div>
        <label>Senha:</label>
        <input type="password" name="password" required/>
    </div>
    <button type="submit">Entrar</button>
</form>
<p>Não tem conta? <a th:href="@{/register}">Cadastre-se aqui</a></p>
</body>
</html>
