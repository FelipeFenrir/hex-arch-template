spring:
  application:
    name: security-server
  data:
    mongodb:
      # Usa a mesma URI, mas pode ser sobrescrita para banco de testes local
      uri: ${SECURITY_MONGODB_URI:mongodb://localhost:27017/security-local}

  threads:
    virtual:
      enabled: true

  thymeleaf:
    enabled: true
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

server:
  port: ${SECURITY_SERVER_PORT:9001}
  error:
    include-message: always

management:
  endpoint:
    prometheus:
      enabled: true
  endpoints:
    metrics:
      enabled: true
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://host.docker.internal:4317}
  resource:
    attributes: service.name=security-server,service.namespace=acme

logging:
  file:
    name: ${SECURITY_SERVER_LOG_FILE:build/logs/security-server.log}
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.jackson2: INFO
    org.springframework.security.oauth2.server.authorization: DEBUG
    com.acme.security: DEBUG

# --- LOCAL BOOTSTRAP SEGURO ---
# Habilitado APENAS no perfil 'local'
security:
  bootstrap:
    # FLAG CRÍTICA: habilita bootstrap local
    enabled: true
    # Proteção: ambiente esperado (deve bater com perfil ativo)
    environment: local
    # Credenciais padrão de teste
    tenant-id: default-tenant
    tenant-name: Default Tenant
    tenant-slug: default
    admin-username: admin
    admin-password: admin@123
    admin-client-id: admin-client
    admin-client-secret: admin-secret@123

